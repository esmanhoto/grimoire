[project]
name = "grimoire-backend"
version = "0.1.0"
description = "Grimoire — local-first DM companion backend (API, combat sync, player view)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
grimoire = "grimoire.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
